; Gilt für alle Skripte unter www/ (PHP-FPM liest .user.ini, Cache 300 s).
; Für Cronjobs (CLI) gilt diese Datei nicht – dort setzt bootstrap.php die Werte.
date.timezone = Europe/Berlin
log_errors = On
error_log = /data/wwwcust/ads/home/logs/php-error.log
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = Strict
session.use_strict_mode = On
